<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Parallax Opposite Hover</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { height: 100%; width: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #111; }
    .viewport {
      width: 90vw; height: 90vh; overflow: hidden; position: relative;
      border: 2px solid rgba(255,255,255,0.3); border-radius: 20px;
      background-color: rgba(255,255,255,0.05); backdrop-filter: blur(5px);
    }
    .image {
      width: 100vw; height: 100vh;
      background-image: url("https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80");
      background-size: cover; background-position: center;
      position: absolute; top: 0; left: 0; z-index: -1;
      will-change: transform;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="image" id="image"></div>
  </div>

  <script>
    const image = document.getElementById('image');
    const viewport = document.querySelector('.viewport');

    viewport.addEventListener('mousemove', (e) => {
      const rect = viewport.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      const offsetX = (x - 0.5) * -40;
      const offsetY = (y - 0.5) * -40;
      gsap.to(image, { x: offsetX, y: offsetY, duration: 0.5, ease: "power3.out" });
    });

    viewport.addEventListener('mouseleave', () => {
      gsap.to(image, { x: 0, y: 0, duration: 0.6, ease: "power2.out" });
    });
  </script>
</body>
</html>
